<!DOCTYPE html>
<html>

<head>
<title>AI College Assistant</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
margin:0;
padding:0;
}

h2{
text-align:center;
background:#2c3e50;
color:white;
padding:15px;
margin:0;
}

#chatbox{
width:80%;
max-width:800px;
height:400px;
margin:20px auto;
border-radius:10px;
padding:15px;
overflow-y:auto;
background:white;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.message{
margin:10px 0;
padding:10px;
border-radius:10px;
max-width:70%;
}

.user{
background:#3498db;
color:white;
margin-left:auto;
text-align:right;
}

.bot{
background:#ecf0f1;
color:black;
margin-right:auto;
}

#inputArea{
width:80%;
max-width:800px;
margin:auto;
display:flex;
gap:10px;
}

input{
flex:1;
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
background:#2ecc71;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

.mic{
background:#e74c3c;
}

</style>
</head>


<body>

<h2>AI College Assistant 🤖</h2>

<div id="chatbox"></div>

<div id="inputArea">
<input id="userInput" placeholder="Ask about colleges, marks, branches...">
<button onclick="sendMessage()">Send</button>
<button class="mic" onclick="startVoice()">🎤</button>
</div>


<script>

function addMessage(text, className){

let chatbox = document.getElementById("chatbox")

let msg = document.createElement("div")
msg.classList.add("message")
msg.classList.add(className)

msg.innerText = text

chatbox.appendChild(msg)

chatbox.scrollTop = chatbox.scrollHeight
}


function sendMessage(){

let input = document.getElementById("userInput")
let message = input.value

if(message.trim() === "") return

addMessage(message,"user")

fetch("http://127.0.0.1:5000/chat",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

})

.then(res=>res.json())
.then(data=>{

addMessage(data.reply,"bot")

})

input.value=""
}



function startVoice(){

const recognition = new(window.SpeechRecognition || window.webkitSpeechRecognition)()

recognition.lang = "en-IN"

recognition.start()

recognition.onresult = function(event){

let voiceText = event.results[0][0].transcript

document.getElementById("userInput").value = voiceText

sendMessage()

}

}

</script>

</body>
</html>
